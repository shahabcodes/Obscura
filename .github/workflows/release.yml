name: Release

# Push a tag like v0.1.0 (matching obscura.versionName) to build, sign and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(grep '^obscura.versionName=' gradle.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$name" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match obscura.versionName=$name"
            exit 1
          fi

      - name: Check changelog entry
        run: |
          grep -q "^## \[${{ steps.version.outputs.name }}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.name }}"; exit 1; }
          awk -v v="${{ steps.version.outputs.name }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OBSCURA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add OBSCURA_KEYSTORE_BASE64, OBSCURA_KEYSTORE_PASSWORD, OBSCURA_KEY_ALIAS and OBSCURA_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/obscura-release.jks"
          echo "OBSCURA_KEYSTORE_PATH=$RUNNER_TEMP/obscura-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          OBSCURA_KEYSTORE_PASSWORD: ${{ secrets.OBSCURA_KEYSTORE_PASSWORD }}
          OBSCURA_KEY_ALIAS: ${{ secrets.OBSCURA_KEY_ALIAS }}
          OBSCURA_KEY_PASSWORD: ${{ secrets.OBSCURA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :crypto:testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Obscura_${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          gh release create "$tag" "Obscura_${{ steps.version.outputs.name }}.apk" \
            --title "Obscura ${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/obscura-release.jks"
