name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "name=$(grep '^obscura.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Unit tests, debug build and network-permission check
        run: ./gradlew --no-daemon :crypto:testDebugUnitTest assembleDebug verifyReleaseNoNetwork

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Obscura_${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: crypto/build/reports/tests/
